name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test

  act:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache ACT fixtures
        uses: actions/cache@v4
        with:
          path: act-fixtures
          key: act-fixtures-${{ hashFiles('src/act/act-mapping.ts') }}

      - name: Download ACT fixtures
        run: npm run act:download

      - name: Run ACT tests
        run: npm run test:act
