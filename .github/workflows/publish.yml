name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance

      - name: Notify a11y-agent
        run: |
          gh api repos/AccessLint/a11y-agent/dispatches \
            -f event_type=core-published \
            -f 'client_payload[version]'="${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.A11Y_AGENT_DISPATCH_TOKEN }}
